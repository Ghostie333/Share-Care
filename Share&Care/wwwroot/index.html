<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Weather Forecast</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
        }

        table {
            border-collapse: collapse;
            width: 60%;
        }

        th, td {
            border: 1px solid #888;
            padding: 8px;
            text-align: center;
        }

        th {
            background-color: #eee;
        }

        button {
            margin-bottom: 15px;
            padding: 8px 12px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <h1>Main Page</h1>
    <h1>Weather Forecasts</h1>
    <button onclick="goToUserPage()">Otwórz User Page</button>
    <button onclick="fetchForecasts()">Odśwież dane</button>
    <button onclick="addToForecasts()">Dodaj dane</button>

    <table>
        <thead>
            <tr>
                <th>Date</th>
                <th>Temperature (°C)</th>
                <th>Summary</th>
            </tr>
        </thead>
        <tbody id="forecast-body">
            <tr><td colspan="3">Ładowanie...</td></tr>
        </tbody>
    </table>

    <script>
        // BACKEND ORIGIN: domyślnie używa originu strony (location.origin),
        // ale możesz nadpisać go w dev: window.BACKEND_URL = "http://192.168.1.68:7070";
        const backendOrigin = window.BACKEND_URL || location.origin;

        const apiAddUrl = `${backendOrigin}/MainPage`;
        const apiAllUrl = `${backendOrigin}/MainPage/all`;

        function goToUserPage() {
            // Jeśli serwujesz statyczne pliki z backendu (wwwroot), użyj ścieżki względnej:
            window.location.href = '/pages/UserProfilePage/';
            // Jeśli front jest serwowany przez inny serwer i potrzebujesz pełnego URL:
            // window.location.href = `${backendOrigin}/pages/UserProfilePage/`;
        }

        async function addToForecasts() {
            try {
                const response = await fetch(apiAddUrl, { method: 'GET' });
                if (!response.ok) throw new Error("Błąd sieci: " + response.status);
                await fetchForecasts();
            } catch (error) {
                alert("Błąd: " + error.message);
            }
        }

        async function fetchForecasts() {
            const tbody = document.getElementById("forecast-body");
            tbody.innerHTML = "<tr><td colspan='3'>Ładowanie...</td></tr>";

            try {
                const response = await fetch(apiAllUrl, { method: 'GET' });
                if (!response.ok) throw new Error("Błąd sieci: " + response.status);

                const data = await response.json();

                if (!Array.isArray(data) || data.length === 0) {
                    tbody.innerHTML = "<tr><td colspan='3'>Brak danych</td></tr>";
                    return;
                }

                tbody.innerHTML = "";
                data.forEach(item => {
                    const tr = document.createElement("tr");
                    tr.innerHTML = `
                            <td>${new Date(item.date).toLocaleDateString()}</td>
                            <td>${item.temperatureC}</td>
                            <td>${item.summary}</td>
                        `;
                    tbody.appendChild(tr);
                });

            } catch (error) {
                tbody.innerHTML = `<tr><td colspan='3'>Błąd: ${error.message}</td></tr>`;
            }
        }

        // fetch przy pierwszym załadowaniu strony
        fetchForecasts();
    </script>
</body>
</html>
